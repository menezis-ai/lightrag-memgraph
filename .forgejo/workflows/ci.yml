name: CI

on:
  push:
    branches: [main, "stable/**"]
  pull_request:
    branches: [main, "stable/**"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest-docker
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # 1.4.10 dropped: intermittent test failures under integration load
        # (likely upstream timing regression, fixed in 1.4.11+). See issue #6.
        lightrag-version: ["1.4.9", "1.4.9.11", "1.4.11", "1.4.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[intelligence,server,test]"
          pip install "lightrag-hku==${{ matrix.lightrag-version }}"

      - name: Run unit tests
        # MEMGRAPH_URI intentionally NOT set: conftest.py auto-skips every
        # @pytest.mark.integration test. Picks up tests/test_intelligence/
        # and tests/test_server/ alongside the storage unit set, without
        # needing to enumerate files.
        run: pytest tests/ --ignore=tests/test_bench.py -v

  integration-tests:
    runs-on: ubuntu-latest-docker
    strategy:
      # Bunker has 11 runners; 15 parallel jobs caused contention spikes
      # that made memgraph:latest cold-start exceed health-retries window.
      # Cap at 5 to keep memgraph cold-starts deterministic.
      max-parallel: 5
      matrix:
        # 1.4.10 dropped: intermittent test failures under integration load
        # (likely upstream timing regression, fixed in 1.4.11+). See issue #6.
        lightrag-version: ["1.4.9", "1.4.9.11", "1.4.11", "1.4.12"]
        memgraph-version: ["3.7.2", "3.8.0", "latest"]
    services:
      memgraph:
        image: memgraph/memgraph-mage:${{ matrix.memgraph-version }}
        # 60 retries × 5s = 5 minutes max cold-start window. Needed for
        # memgraph-mage:latest (3.9+) which is heavier than 3.7.2.
        options: >-
          --health-cmd "echo 'RETURN 1;' | mgconsole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[intelligence,server,test]"
          pip install "lightrag-hku==${{ matrix.lightrag-version }}"

      - name: Run integration tests
        env:
          MEMGRAPH_URI: bolt://memgraph:7687
        run: pytest tests/ --ignore=tests/test_bench.py -v
