name: CI

on:
  push:
    branches: [main, "stable/**"]
  pull_request:
    branches: [main, "stable/**"]

jobs:
  unit-tests:
    runs-on: [self-hosted, docker]
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # 1.4.10 dropped: intermittent test failures under integration load
        # (likely upstream timing regression, fixed in 1.4.11+). See issue #6.
        # 1.4.9 dropped 2026-05-29: BNP runs 1.4.9.11 (hotfix release), not
        # 1.4.9 vanilla. Coverage on 1.4.9 added persistent flake to the
        # bunker runner (jobs failing at install OR at random tests across
        # different runs of the same commit). Same logic as the 3.7.2/3.8.0
        # Memgraph drop: matrix = BNP target + forward-compat only.
        lightrag-version: ["1.4.9.11", "1.4.11", "1.4.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests in Python ${{ matrix.python-version }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            python:${{ matrix.python-version }}-bookworm \
            sh -lc '
              python -m pip install --upgrade pip &&
              python -m pip install -e ".[intelligence,server,test]" &&
              python -m pip install "lightrag-hku==${{ matrix.lightrag-version }}" &&
              pytest tests/ --ignore=tests/test_bench.py -v
            '

  integration-tests:
    runs-on: [self-hosted, high]
    strategy:
      # Matrix is now 4 LightRAG × 1 Memgraph = 4 parallel jobs, well under
      # the contention threshold that previously starved cold-starts.
      max-parallel: 5
      matrix:
        # 1.4.10 dropped: intermittent test failures under integration load
        # (likely upstream timing regression, fixed in 1.4.11+). See issue #6.
        # 1.4.9 dropped 2026-05-29: BNP runs 1.4.9.11 (hotfix release), not
        # 1.4.9 vanilla. Coverage on 1.4.9 added persistent flake to the
        # bunker runner (jobs failing at install OR at random tests across
        # different runs of the same commit). Same logic as the 3.7.2/3.8.0
        # Memgraph drop: matrix = BNP target + forward-compat only.
        lightrag-version: ["1.4.9.11", "1.4.11", "1.4.12"]
        # 3.7.2 / 3.8.0 dropped: never deployed at BNP. 3.10.1 is the current
        # BNP prod target — pinned explicitly so the rolling `latest` tag
        # can't silently move the coverage point under us.
        memgraph-version: ["3.10.1"]
    services:
      memgraph:
        image: memgraph/memgraph-mage:${{ matrix.memgraph-version }}
        # --memory 3g: bumped from 2g after 2026-05-29 PR #143 showed
        # 1.4.9 × 3.10.1 fail at ~7m53s under sustained query load. Local
        # repro on Python 3.12 with the same combo runs in 25s with 615
        # tests passing, so the runner was OOM-killing memgraph mid-suite.
        # 3.10.1 mage image is heavier than 3.7.2 (the previous "always
        # passes" baseline) — 3g cap accommodates Memgraph + MAGE + sustained
        # vector_search load without leaving the runner thrashing.
        # --health-retries 120 (10 min): mage:latest (3.9+) cold-start can
        # exceed the previous 5 min window on a contended runner.
        options: >-
          --memory 3g
          --memory-swap 3g
          --health-cmd "echo 'RETURN 1;' | mgconsole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[intelligence,server,test]"
          python -m pip install "lightrag-hku==${{ matrix.lightrag-version }}"

      - name: Run integration tests
        env:
          MEMGRAPH_URI: bolt://memgraph:7687
        run: pytest tests/ --ignore=tests/test_bench.py -v

  webui-lint:
    # ESLint gate (low-cost: no install of Playwright / heavyweight deps
    # beyond `bun install`). Runs in parallel with the heavier WebUI
    # jobs so a style/error regression fails fast without waiting for
    # vitest / build / e2e.
    runs-on: [self-hosted, docker]
    defaults:
      run:
        working-directory: lightrag_webui_twin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  webui-tests:
    # Typecheck, run Vitest, and build the Twin WebUI frontend.
    # Bun is pre-installed on the bunker runners (Forgejo Actions self-hosted).
    runs-on: [self-hosted, docker]
    defaults:
      run:
        working-directory: lightrag_webui_twin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        # Pin the exact version so setup-bun does not call api.github.com to
        # resolve "latest" — the bunker runner shares its outbound IP, and
        # anonymous GitHub API hits the rate limit (60/h/IP) too easily.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test:run

      - name: Build
        run: bun run build

  webui-e2e:
    # Full Playwright operator journeys against the MSW-backed WebUI.
    # real-backend.spec.ts remains in the suite but skips unless
    # REAL_BACKEND_URL is provided by a deployment/staging workflow.
    runs-on: [self-hosted, docker]
    defaults:
      run:
        working-directory: lightrag_webui_twin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: bun run test:e2e

  webui-e2e-real:
    # Browser smoke + real Twin backend mutation coverage against Memgraph.
    # The LLM-backed retrieval UI case remains opt-in because CI has no model
    # credentials; all non-LLM real-backend cases run here.
    runs-on: [self-hosted, high]
    services:
      memgraph:
        image: memgraph/memgraph-mage:3.10.1
        options: >-
          --memory 3g
          --memory-swap 3g
          --health-cmd "echo 'RETURN 1;' | mgconsole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 120
    env:
      MEMGRAPH_URI: bolt://memgraph:7687
      REAL_BACKEND_URL: http://127.0.0.1:9621
      REAL_BACKEND_FOLDER: default
      REAL_BACKEND_AUTH_TOKEN: real-e2e-token
      VITE_AUTH_TOKEN: real-e2e-token
      REAL_E2E_EXPECT_AUTH: "true"
      REAL_E2E_MUTATION_DOC_ID: real-e2e-retag-doc
      REAL_E2E_BULK_DELETE_DOC_ID: real-e2e-delete-doc
      REAL_E2E_RETAG_TAG: real_e2e_tag
      TWIN_DEFAULT_FOLDER: default
      TWIN_FOLDERS_JSON: '[{"id":"default","label":"Default","kind":"primary"}]'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[intelligence,server,test]"
          python -m pip install "lightrag-hku==1.4.9.11"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install WebUI dependencies
        working-directory: lightrag_webui_twin
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: lightrag_webui_twin
        run: bunx playwright install --with-deps chromium

      - name: Start real backend
        run: |
          nohup env \
            MEMGRAPH_URI="$MEMGRAPH_URI" \
            HOST=127.0.0.1 \
            PORT=9621 \
            LIGHTRAG_API_KEY="$REAL_BACKEND_AUTH_TOKEN" \
            LIGHTRAG_KV_STORAGE=MemgraphKVStorage \
            LIGHTRAG_VECTOR_STORAGE=MemgraphVectorDBStorage \
            LIGHTRAG_GRAPH_STORAGE=MemgraphStorage \
            LIGHTRAG_DOC_STATUS_STORAGE=MemgraphDocStatusStorage \
            LLM_BINDING=openai \
            LLM_BINDING_API_KEY=ci-disabled \
            EMBEDDING_BINDING=openai \
            EMBEDDING_BINDING_API_KEY=ci-disabled \
            EMBEDDING_MODEL=text-embedding-3-small \
            EMBEDDING_DIM=1536 \
            TWIN_DEFAULT_FOLDER="$TWIN_DEFAULT_FOLDER" \
            TWIN_FOLDERS_JSON="$TWIN_FOLDERS_JSON" \
            python -c "import twindb_lightrag_memgraph; twindb_lightrag_memgraph.register(mount_server=True, shim_native_routes=True, webui_stores='memgraph'); from lightrag.api.lightrag_server import main; main()" \
            > real-backend.log 2>&1 &
          echo $! > real-backend.pid

      - name: Wait for real backend
        run: |
          for i in $(seq 1 120); do
            if curl -fsS \
              -H "Authorization: Bearer $REAL_BACKEND_AUTH_TOKEN" \
              "$REAL_BACKEND_URL/twin/api/health"; then
              exit 0
            fi
            sleep 2
          done
          tail -n 200 real-backend.log
          exit 1

      - name: Seed real-backend e2e fixtures
        run: python scripts/real_backend_e2e_fixtures.py seed

      - name: Run real-backend Playwright e2e
        working-directory: lightrag_webui_twin
        run: bun run test:e2e:real

      - name: Cleanup real-backend e2e fixtures
        if: always()
        run: python scripts/real_backend_e2e_fixtures.py cleanup

      - name: Stop real backend
        if: always()
        run: |
          if [ -f real-backend.pid ]; then
            kill "$(cat real-backend.pid)" || true
          fi

      - name: Print backend log on failure
        if: failure()
        run: tail -n 300 real-backend.log || true
