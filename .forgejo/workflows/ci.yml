name: CI

on:
  push:
    branches: [main, "stable/**"]
  pull_request:
    branches: [main, "stable/**"]

jobs:
  unit-tests:
    runs-on: [self-hosted, docker]
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # 1.4.10 dropped: intermittent test failures under integration load
        # (likely upstream timing regression, fixed in 1.4.11+). See issue #6.
        # 1.4.9 dropped 2026-05-29: BNP runs 1.4.9.11 (hotfix release), not
        # 1.4.9 vanilla. Coverage on 1.4.9 added persistent flake to the
        # bunker runner (jobs failing at install OR at random tests across
        # different runs of the same commit). Same logic as the 3.7.2/3.8.0
        # Memgraph drop: matrix = BNP target + forward-compat only.
        lightrag-version: ["1.4.9.11", "1.4.11", "1.4.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests in Python ${{ matrix.python-version }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/work" \
            -w /work \
            python:${{ matrix.python-version }}-bookworm \
            sh -lc '
              python -m venv /tmp/venv &&
              . /tmp/venv/bin/activate &&
              python -m pip install --upgrade pip &&
              python -m pip install -c requirements/constraints-dev.txt "lightrag-hku[api]==${{ matrix.lightrag-version }}" &&
              python -m pip install -c requirements/constraints-dev.txt -e ".[intelligence,server,test]" &&
              python -m pip install pip-audit &&
              # Audit production pins, not the broader test environment.
              # LightRAG 1.4.9.11 is the pinned BNP baseline. These two
              # upstream CVEs are temporarily risk-accepted with owner,
              # rationale, and review date documented in:
              # docs/security/lightrag-1.4.9.11-risk-acceptance.md
              # Keep the exception explicit so every other production
              # dependency vulnerability still fails the gate.
              pip-audit -r requirements/constraints-prod.txt --no-deps --disable-pip \
                --ignore-vuln CVE-2026-30762 \
                --ignore-vuln CVE-2026-39413 &&
              pytest tests/ --ignore=tests/test_bench.py -v
            '

  integration-tests:
    runs-on: [self-hosted, docker]
    strategy:
      # Own Docker network per matrix job; keep one Memgraph-heavy job per
      # runner to avoid memory contention.
      max-parallel: 1
      matrix:
        # 1.4.10 dropped: intermittent test failures under integration load
        # (likely upstream timing regression, fixed in 1.4.11+). See issue #6.
        # 1.4.9 dropped 2026-05-29: BNP runs 1.4.9.11 (hotfix release), not
        # 1.4.9 vanilla. Coverage on 1.4.9 added persistent flake to the
        # bunker runner (jobs failing at install OR at random tests across
        # different runs of the same commit). Same logic as the 3.7.2/3.8.0
        # Memgraph drop: matrix = BNP target + forward-compat only.
        lightrag-version: ["1.4.9.11", "1.4.11", "1.4.12"]
        # 3.7.2 / 3.8.0 dropped: never deployed at BNP. BNP rolled back to
        # 3.9.0 on 2026-06-19 (now the prod target); 3.10.1 kept as forward-
        # compat (3.11 imminent). Both pinned explicitly so the rolling
        # `latest` tag can't silently move the coverage point under us.
        memgraph-version: ["3.9.0", "3.10.1"]
    steps:
      - uses: actions/checkout@v4

      - name: Run integration tests
        run: |
          safe_version="$(printf '%s' '${{ matrix.lightrag-version }}' | tr -c 'A-Za-z0-9' '-')"
          safe_mg="$(printf '%s' '${{ matrix.memgraph-version }}' | tr -c 'A-Za-z0-9' '-')"
          net="twin-ci-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-integration-${safe_version}-${safe_mg}"
          memgraph="twin-ci-memgraph-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-${safe_version}-${safe_mg}"

          docker rm -f "$memgraph" >/dev/null 2>&1 || true
          docker network rm "$net" >/dev/null 2>&1 || true
          docker network create "$net"
          cleanup() {
            docker rm -f "$memgraph" >/dev/null 2>&1 || true
            docker network rm "$net" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$memgraph" \
            --network "$net" \
            --network-alias memgraph \
            --memory 3g \
            --memory-swap 3g \
            memgraph/memgraph-mage:${{ matrix.memgraph-version }}

          for i in $(seq 1 120); do
            if docker exec "$memgraph" bash -lc "echo 'RETURN 1;' | mgconsole"; then
              break
            fi
            if [ "$i" = "120" ]; then
              docker logs "$memgraph" || true
              exit 1
            fi
            sleep 5
          done

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            --network "$net" \
            -e MEMGRAPH_URI=bolt://memgraph:7687 \
            -v "$PWD:/work" \
            -w /work \
            python:3.12-bookworm \
            sh -lc '
              python -m venv /tmp/venv &&
              . /tmp/venv/bin/activate &&
              python -m pip install --upgrade pip &&
              python -m pip install -c requirements/constraints-dev.txt "lightrag-hku[api]==${{ matrix.lightrag-version }}" &&
              python -m pip install -c requirements/constraints-dev.txt -e ".[intelligence,server,test]" &&
              python -m pip install pip-audit &&
              # Audit production pins, not the broader test environment.
              # LightRAG 1.4.9.11 is the pinned BNP baseline. These two
              # upstream CVEs are temporarily risk-accepted with owner,
              # rationale, and review date documented in:
              # docs/security/lightrag-1.4.9.11-risk-acceptance.md
              # Keep the exception explicit so every other production
              # dependency vulnerability still fails the gate.
              pip-audit -r requirements/constraints-prod.txt --no-deps --disable-pip \
                --ignore-vuln CVE-2026-30762 \
                --ignore-vuln CVE-2026-39413 &&
              pytest tests/ --ignore=tests/test_bench.py -v
            '

  webui-lint:
    # ESLint gate (low-cost: no install of Playwright / heavyweight deps
    # beyond `bun install`). Runs in parallel with the heavier WebUI
    # jobs so a style/error regression fails fast without waiting for
    # vitest / build / e2e.
    # Doctrine: lint = light job → low/lint pool, NOT docker. (Was
    # [self-hosted, docker]: mislabelled, landed on docker CTs and tripped
    # setup-bun's unzip dependency.)
    runs-on: [self-hosted, low, lint]
    defaults:
      run:
        working-directory: lightrag_webui_twin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  webui-tests:
    # Typecheck, run Vitest, and build the Twin WebUI frontend.
    # Bun is pre-installed on the bunker runners (Forgejo Actions self-hosted).
    runs-on: [self-hosted, docker]
    defaults:
      run:
        working-directory: lightrag_webui_twin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        # Pin the exact version so setup-bun does not call api.github.com to
        # resolve "latest" — the bunker runner shares its outbound IP, and
        # anonymous GitHub API hits the rate limit (60/h/IP) too easily.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        # Plain test:run keeps this blocking gate fast + stable. Coverage
        # (lcov for SonarQube) is generated in the non-blocking `sonar` job —
        # v8 coverage instrumentation slows the suite enough to tip the
        # race-prone RetrievalTab component tests over their timeout, so it
        # must not gate merges.
        run: bun run test:run

      - name: Build
        run: bun run build

  webui-e2e:
    # Full Playwright operator journeys against the MSW-backed WebUI.
    # real-backend.spec.ts remains in the suite but skips unless
    # REAL_BACKEND_URL is provided by a deployment/staging workflow.
    runs-on: [self-hosted, high]
    defaults:
      run:
        working-directory: lightrag_webui_twin
    steps:
      - uses: actions/checkout@v4

      - name: Ensure persistent npm cache dir
        # Owned by the runner UID so the docker --user mapping can write.
        # Persisted across runs on the runner host -> npm ci becomes
        # "unpack from local cache" instead of "download 250+ tarballs".
        run: mkdir -p "$HOME/.cache/twin-ci-npm"
        working-directory: ${{ github.workspace }}

      - name: Run Playwright e2e
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/npm \
            -e CI=true \
            -v "$PWD:/work" \
            -v "$HOME/.cache/twin-ci-npm:/tmp/npm" \
            -w /work \
            mcr.microsoft.com/playwright:v1.60.0-noble \
            sh -lc 'npm ci --prefer-offline --no-audit --no-fund && npm run test:e2e'

  webui-e2e-real:
    # Browser smoke + real Twin backend mutation coverage against Memgraph.
    # The LLM-backed retrieval UI case remains opt-in because CI has no model
    # credentials; all non-LLM real-backend cases run here.
    runs-on: [self-hosted, high]
    env:
      MEMGRAPH_URI: bolt://memgraph:7687
      REAL_BACKEND_URL: http://127.0.0.1:9621
      REAL_BACKEND_FOLDER: default
      REAL_BACKEND_AUTH_TOKEN: real-e2e-token
      VITE_AUTH_TOKEN: real-e2e-token
      REAL_E2E_EXPECT_AUTH: "true"
      REAL_E2E_MUTATION_DOC_ID: real-e2e-retag-doc
      REAL_E2E_BULK_DELETE_DOC_ID: real-e2e-delete-doc
      REAL_E2E_RETAG_TAG: real_e2e_tag
      TWIN_DEFAULT_FOLDER: default
      TWIN_FOLDERS_JSON: '[{"id":"default","label":"Default","kind":"primary"}]'
    steps:
      - uses: actions/checkout@v4

      - name: Start real backend
        run: |
          net="twin-ci-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-webui-real"
          memgraph="twin-ci-memgraph-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-webui-real"
          backend="twin-ci-backend-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-webui-real"
          printf '%s\n' "$net" > .ci-real-network
          printf '%s\n' "$memgraph" > .ci-real-memgraph
          printf '%s\n' "$backend" > .ci-real-backend

          docker rm -f "$backend" "$memgraph" >/dev/null 2>&1 || true
          docker network rm "$net" >/dev/null 2>&1 || true
          docker network create "$net"

          docker run -d \
            --name "$memgraph" \
            --network "$net" \
            --network-alias memgraph \
            --memory 3g \
            --memory-swap 3g \
            memgraph/memgraph-mage:3.9.0

          for i in $(seq 1 120); do
            if docker exec "$memgraph" bash -lc "echo 'RETURN 1;' | mgconsole"; then
              break
            fi
            if [ "$i" = "120" ]; then
              docker logs "$memgraph" || true
              exit 1
            fi
            sleep 5
          done

          docker run -d \
            --name "$backend" \
            --network "$net" \
            -p 127.0.0.1:9621:9621 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/work" \
            -w /work \
            -e MEMGRAPH_URI="$MEMGRAPH_URI" \
            -e HOST=0.0.0.0 \
            -e PORT=9621 \
            -e LIGHTRAG_API_KEY="$REAL_BACKEND_AUTH_TOKEN" \
            -e LIGHTRAG_KV_STORAGE=MemgraphKVStorage \
            -e LIGHTRAG_VECTOR_STORAGE=MemgraphVectorDBStorage \
            -e LIGHTRAG_GRAPH_STORAGE=MemgraphStorage \
            -e LIGHTRAG_DOC_STATUS_STORAGE=MemgraphDocStatusStorage \
            -e LLM_BINDING=openai \
            -e LLM_BINDING_API_KEY=ci-disabled \
            -e EMBEDDING_BINDING=openai \
            -e EMBEDDING_BINDING_API_KEY=ci-disabled \
            -e EMBEDDING_MODEL=text-embedding-3-small \
            -e EMBEDDING_DIM=1536 \
            -e TWIN_DEFAULT_FOLDER="$TWIN_DEFAULT_FOLDER" \
            -e TWIN_FOLDERS_JSON="$TWIN_FOLDERS_JSON" \
            python:3.12-bookworm \
            sh -lc 'python -m venv /tmp/venv && . /tmp/venv/bin/activate && python -m pip install --upgrade pip && python -m pip install -c requirements/constraints-prod.txt -e ".[intelligence,server,test]" && python -c "import twindb_lightrag_memgraph; twindb_lightrag_memgraph.register(mount_server=True, shim_native_routes=True, webui_stores=\"memgraph\"); from lightrag.api.lightrag_server import main; main()"'

      - name: Wait for real backend
        run: |
          for i in $(seq 1 300); do
            if curl -fsS \
              -H "Authorization: Bearer $REAL_BACKEND_AUTH_TOKEN" \
              "$REAL_BACKEND_URL/twin/api/health"; then
              exit 0
            fi
            if [ $((i % 30)) = 0 ]; then
              docker logs --tail 80 "$(cat .ci-real-backend)" || true
            fi
            sleep 2
          done
          docker logs --tail 200 "$(cat .ci-real-backend)" || true
          exit 1

      - name: Seed real-backend e2e fixtures
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            --network "$(cat .ci-real-network)" \
            -v "$PWD:/work" \
            -w /work \
            -e MEMGRAPH_URI="$MEMGRAPH_URI" \
            -e REAL_BACKEND_FOLDER="$REAL_BACKEND_FOLDER" \
            -e REAL_E2E_MUTATION_DOC_ID="$REAL_E2E_MUTATION_DOC_ID" \
            -e REAL_E2E_BULK_DELETE_DOC_ID="$REAL_E2E_BULK_DELETE_DOC_ID" \
            -e REAL_E2E_RETAG_TAG="$REAL_E2E_RETAG_TAG" \
            python:3.12-bookworm \
            sh -lc 'python -m venv /tmp/venv && . /tmp/venv/bin/activate && python -m pip install neo4j && python scripts/real_backend_e2e_fixtures.py seed'

      - name: Ensure persistent npm cache dir
        run: mkdir -p "$HOME/.cache/twin-ci-npm"

      - name: Run real-backend Playwright e2e
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network host \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/npm \
            -e CI=true \
            -e REAL_BACKEND_URL="$REAL_BACKEND_URL" \
            -e VITE_AUTH_TOKEN="$VITE_AUTH_TOKEN" \
            -e REAL_E2E_EXPECT_AUTH="$REAL_E2E_EXPECT_AUTH" \
            -v "$PWD/lightrag_webui_twin:/work" \
            -v "$HOME/.cache/twin-ci-npm:/tmp/npm" \
            -w /work \
            mcr.microsoft.com/playwright:v1.60.0-noble \
            sh -lc 'npm ci --prefer-offline --no-audit --no-fund && npm run test:e2e:real'

      - name: Cleanup real-backend e2e fixtures
        if: always()
        run: |
          if [ ! -f .ci-real-network ]; then
            exit 0
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            --network "$(cat .ci-real-network)" \
            -v "$PWD:/work" \
            -w /work \
            -e MEMGRAPH_URI="$MEMGRAPH_URI" \
            -e REAL_BACKEND_FOLDER="$REAL_BACKEND_FOLDER" \
            -e REAL_E2E_MUTATION_DOC_ID="$REAL_E2E_MUTATION_DOC_ID" \
            -e REAL_E2E_BULK_DELETE_DOC_ID="$REAL_E2E_BULK_DELETE_DOC_ID" \
            -e REAL_E2E_RETAG_TAG="$REAL_E2E_RETAG_TAG" \
            python:3.12-bookworm \
            sh -lc 'python -m venv /tmp/venv && . /tmp/venv/bin/activate && python -m pip install neo4j && python scripts/real_backend_e2e_fixtures.py cleanup'

      - name: Stop real backend
        if: always()
        run: |
          if [ -f .ci-real-backend ]; then
            docker stop "$(cat .ci-real-backend)" || true
          fi

      - name: Print backend log on failure
        if: failure()
        run: |
          if [ -f .ci-real-backend ]; then
            docker logs --tail 300 "$(cat .ci-real-backend)" || true
          fi

      - name: Cleanup real backend containers
        if: always()
        run: |
          if [ -f .ci-real-backend ] && [ -f .ci-real-memgraph ]; then
            docker rm -f "$(cat .ci-real-backend)" "$(cat .ci-real-memgraph)" || true
          fi
          if [ -f .ci-real-network ]; then
            docker network rm "$(cat .ci-real-network)" || true
          fi

  webui-e2e-keygen:
    # Same adversarial API-coverage protocol as webui-e2e-real, but every
    # request is authenticated with a key MINTED THROUGH the Settings -> API
    # keys endpoint (api_key_store), proving generated keys are real
    # credentials. Separate runner + its own backend on port 9622 (distinct
    # container/network names) so it can run beside webui-e2e-real without
    # colliding. No fixture seed: the coverage is adversarial (unknown ids,
    # malformed input, anonymous), so it needs no pre-seeded documents.
    runs-on: [self-hosted, high]
    env:
      MEMGRAPH_URI: bolt://memgraph:7687
      REAL_BACKEND_URL: http://127.0.0.1:9622
      REAL_BACKEND_FOLDER: default
      REAL_BACKEND_AUTH_TOKEN: real-e2e-token
      VITE_AUTH_TOKEN: real-e2e-token
      REAL_E2E_EXPECT_AUTH: "true"
      TWIN_DEFAULT_FOLDER: default
      TWIN_FOLDERS_JSON: '[{"id":"default","label":"Default","kind":"primary"}]'
    steps:
      - uses: actions/checkout@v4

      - name: Start real backend (keygen)
        run: |
          net="twin-ci-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-keygen"
          memgraph="twin-ci-memgraph-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-keygen"
          backend="twin-ci-backend-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-keygen"
          printf '%s\n' "$net" > .ci-keygen-network
          printf '%s\n' "$memgraph" > .ci-keygen-memgraph
          printf '%s\n' "$backend" > .ci-keygen-backend

          docker rm -f "$backend" "$memgraph" >/dev/null 2>&1 || true
          docker network rm "$net" >/dev/null 2>&1 || true
          docker network create "$net"

          docker run -d \
            --name "$memgraph" \
            --network "$net" \
            --network-alias memgraph \
            --memory 3g \
            --memory-swap 3g \
            memgraph/memgraph-mage:3.9.0

          for i in $(seq 1 120); do
            if docker exec "$memgraph" bash -lc "echo 'RETURN 1;' | mgconsole"; then
              break
            fi
            if [ "$i" = "120" ]; then
              docker logs "$memgraph" || true
              exit 1
            fi
            sleep 5
          done

          docker run -d \
            --name "$backend" \
            --network "$net" \
            -p 127.0.0.1:9622:9622 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/work" \
            -w /work \
            -e MEMGRAPH_URI="$MEMGRAPH_URI" \
            -e HOST=0.0.0.0 \
            -e PORT=9622 \
            -e LIGHTRAG_API_KEY="$REAL_BACKEND_AUTH_TOKEN" \
            -e LIGHTRAG_KV_STORAGE=MemgraphKVStorage \
            -e LIGHTRAG_VECTOR_STORAGE=MemgraphVectorDBStorage \
            -e LIGHTRAG_GRAPH_STORAGE=MemgraphStorage \
            -e LIGHTRAG_DOC_STATUS_STORAGE=MemgraphDocStatusStorage \
            -e LLM_BINDING=openai \
            -e LLM_BINDING_API_KEY=ci-disabled \
            -e EMBEDDING_BINDING=openai \
            -e EMBEDDING_BINDING_API_KEY=ci-disabled \
            -e EMBEDDING_MODEL=text-embedding-3-small \
            -e EMBEDDING_DIM=1536 \
            -e TWIN_DEFAULT_FOLDER="$TWIN_DEFAULT_FOLDER" \
            -e TWIN_FOLDERS_JSON="$TWIN_FOLDERS_JSON" \
            python:3.12-bookworm \
            sh -lc 'python -m venv /tmp/venv && . /tmp/venv/bin/activate && python -m pip install --upgrade pip && python -m pip install -c requirements/constraints-prod.txt -e ".[intelligence,server,test]" && python -c "import twindb_lightrag_memgraph; twindb_lightrag_memgraph.register(mount_server=True, shim_native_routes=True, webui_stores=\"memgraph\"); from lightrag.api.lightrag_server import main; main()"'

      - name: Wait for real backend (keygen)
        run: |
          for i in $(seq 1 300); do
            if curl -fsS \
              -H "Authorization: Bearer $REAL_BACKEND_AUTH_TOKEN" \
              "$REAL_BACKEND_URL/twin/api/health"; then
              exit 0
            fi
            if [ $((i % 30)) = 0 ]; then
              docker logs --tail 80 "$(cat .ci-keygen-backend)" || true
            fi
            sleep 2
          done
          docker logs --tail 200 "$(cat .ci-keygen-backend)" || true
          exit 1

      - name: Ensure persistent npm cache dir
        run: mkdir -p "$HOME/.cache/twin-ci-npm"

      - name: Run generated-key Playwright e2e
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network host \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/npm \
            -e CI=true \
            -e PLAYWRIGHT_PORT=4175 \
            -e REAL_BACKEND_URL="$REAL_BACKEND_URL" \
            -e REAL_BACKEND_AUTH_TOKEN="$REAL_BACKEND_AUTH_TOKEN" \
            -e REAL_BACKEND_FOLDER="$REAL_BACKEND_FOLDER" \
            -e REAL_E2E_EXPECT_AUTH="$REAL_E2E_EXPECT_AUTH" \
            -v "$PWD/lightrag_webui_twin:/work" \
            -v "$HOME/.cache/twin-ci-npm:/tmp/npm" \
            -w /work \
            mcr.microsoft.com/playwright:v1.60.0-noble \
            sh -lc 'npm ci --prefer-offline --no-audit --no-fund && npm run test:e2e:keygen'

      - name: Print backend log on failure (keygen)
        if: failure()
        run: |
          if [ -f .ci-keygen-backend ]; then
            docker logs --tail 300 "$(cat .ci-keygen-backend)" || true
          fi

      - name: Cleanup keygen backend containers
        if: always()
        run: |
          if [ -f .ci-keygen-backend ] && [ -f .ci-keygen-memgraph ]; then
            docker rm -f "$(cat .ci-keygen-backend)" "$(cat .ci-keygen-memgraph)" || true
          fi
          if [ -f .ci-keygen-network ]; then
            docker network rm "$(cat .ci-keygen-network)" || true
          fi

  sonar:
    # Informational SonarQube analysis (coverage + complexity + quality gate).
    #
    # NON-BLOCKING by design (continue-on-error): a failing quality gate shows
    # a red "CI / sonar" check but never blocks a merge. To make it enforcing
    # once the codebase is clean: (1) remove `continue-on-error: true` below,
    # and (2) add `CI / sonar` to the branch-protection required checks on main.
    #
    # Requires the SONAR_TOKEN repo secret (Forgejo → repo Settings → Actions →
    # Secrets). While non-blocking, a missing/invalid token just fails this job
    # harmlessly. Self-contained: regenerates Python coverage.xml + WebUI
    # lcov.info, then scans — so it does not depend on artifacts from the other
    # jobs.
    runs-on: [self-hosted, docker]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Sonar SCM blame + new-code period work correctly.
          fetch-depth: 0

      - name: Python coverage (coverage.xml)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/work" \
            -w /work \
            python:3.12-bookworm \
            sh -lc '
              python -m venv /tmp/venv &&
              . /tmp/venv/bin/activate &&
              python -m pip install --upgrade pip &&
              python -m pip install -c requirements/constraints-dev.txt "lightrag-hku[api]==1.4.9.11" &&
              python -m pip install -c requirements/constraints-dev.txt -e ".[intelligence,server,test]" &&
              python -m pip install coverage &&
              { coverage run -m pytest tests/ --ignore=tests/test_bench.py || true; } &&
              coverage xml
            '

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: WebUI coverage (lcov.info)
        working-directory: lightrag_webui_twin
        run: |
          bun install --frozen-lockfile
          # Tolerate flaky component tests: lcov is still written and the scan
          # must run regardless (this job is informational / non-blocking).
          bun run test:coverage || true

      - name: SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm \
            --network host \
            -e SONAR_TOKEN \
            -v "$PWD:/usr/src" \
            sonarsource/sonar-scanner-cli:11
