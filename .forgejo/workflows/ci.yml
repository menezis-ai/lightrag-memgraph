name: CI

on:
  push:
    branches: [main, "stable/**"]
  pull_request:
    branches: [main, "stable/**"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest-docker
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # 1.4.10 dropped: intermittent test failures under integration load
        # (likely upstream timing regression, fixed in 1.4.11+). See issue #6.
        lightrag-version: ["1.4.9", "1.4.9.11", "1.4.11", "1.4.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[intelligence,server,test]"
          pip install "lightrag-hku==${{ matrix.lightrag-version }}"

      - name: Run unit tests
        # MEMGRAPH_URI intentionally NOT set: conftest.py auto-skips every
        # @pytest.mark.integration test. Picks up tests/test_intelligence/
        # and tests/test_server/ alongside the storage unit set, without
        # needing to enumerate files.
        run: pytest tests/ --ignore=tests/test_bench.py -v

  integration-tests:
    runs-on: ubuntu-latest-docker
    strategy:
      # Matrix is now 4 LightRAG × 1 Memgraph = 4 parallel jobs, well under
      # the contention threshold that previously starved cold-starts.
      max-parallel: 5
      matrix:
        # 1.4.10 dropped: intermittent test failures under integration load
        # (likely upstream timing regression, fixed in 1.4.11+). See issue #6.
        lightrag-version: ["1.4.9", "1.4.9.11", "1.4.11", "1.4.12"]
        # 3.7.2 / 3.8.0 dropped: never deployed at BNP. 3.10.1 is the current
        # BNP prod target — pinned explicitly so the rolling `latest` tag
        # can't silently move the coverage point under us.
        memgraph-version: ["3.10.1"]
    services:
      memgraph:
        image: memgraph/memgraph-mage:${{ matrix.memgraph-version }}
        # --memory 3g: bumped from 2g after 2026-05-29 PR #143 showed
        # 1.4.9 × 3.10.1 fail at ~7m53s under sustained query load. Local
        # repro on Python 3.12 with the same combo runs in 25s with 615
        # tests passing, so the runner was OOM-killing memgraph mid-suite.
        # 3.10.1 mage image is heavier than 3.7.2 (the previous "always
        # passes" baseline) — 3g cap accommodates Memgraph + MAGE + sustained
        # vector_search load without leaving the runner thrashing.
        # --health-retries 120 (10 min): mage:latest (3.9+) cold-start can
        # exceed the previous 5 min window on a contended runner.
        options: >-
          --memory 3g
          --memory-swap 3g
          --health-cmd "echo 'RETURN 1;' | mgconsole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[intelligence,server,test]"
          pip install "lightrag-hku==${{ matrix.lightrag-version }}"

      - name: Run integration tests
        env:
          MEMGRAPH_URI: bolt://memgraph:7687
        run: pytest tests/ --ignore=tests/test_bench.py -v

  webui-tests:
    # Typecheck, run Vitest, and build the Twin WebUI frontend.
    # Bun is pre-installed on the bunker runners (Forgejo Actions self-hosted).
    runs-on: ubuntu-latest-docker
    defaults:
      run:
        working-directory: lightrag_webui_twin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        # Pin the exact version so setup-bun does not call api.github.com to
        # resolve "latest" — the bunker runner shares its outbound IP, and
        # anonymous GitHub API hits the rate limit (60/h/IP) too easily.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test:run

      - name: Build
        run: bun run build
