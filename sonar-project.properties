# S6819 ("use <select>/<datalist> instead of role=listbox") is a false positive
# for our ARIA 1.2 combobox autocompletes. The suggestion popup MUST be
# role="listbox", paired with the role="combobox" input via aria-controls +
# aria-activedescendant (WAI-ARIA APG combobox pattern). A native <select> or
# <datalist> cannot render custom async tag suggestions with highlighted matches
# or activedescendant keyboard navigation. Scoped to the 5 combobox components
# so a genuinely misused role="listbox" elsewhere is still flagged.
sonar.issue.ignore.multicriteria=cb1,cb2,cb3,cb4,cb5
sonar.issue.ignore.multicriteria.cb1.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.cb1.resourceKey=**/AddSourceModal.tsx
sonar.issue.ignore.multicriteria.cb2.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.cb2.resourceKey=**/DocumentsTab.tsx
sonar.issue.ignore.multicriteria.cb3.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.cb3.resourceKey=**/GraphFilters.tsx
sonar.issue.ignore.multicriteria.cb4.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.cb4.resourceKey=**/GraphInspector.tsx
sonar.issue.ignore.multicriteria.cb5.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.cb5.resourceKey=**/RetagModal.tsx
