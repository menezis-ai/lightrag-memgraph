# S6819 ("use <select>/<datalist> instead of role=listbox") is a false positive
# for our ARIA 1.2 combobox autocompletes. The suggestion popup MUST be
# role="listbox", paired with the role="combobox" input via aria-controls +
# aria-activedescendant (WAI-ARIA APG combobox pattern). A native <select> or
# <datalist> cannot render custom async tag suggestions with highlighted matches
# or activedescendant keyboard navigation. Scoped to the 5 combobox components
# so a genuinely misused role="listbox" elsewhere is still flagged.
# S1607 ("remove or explain this skipped test") is a false positive for the
# Playwright conditional-skip idiom `test.skip(condition, 'reason')` used across
# the e2e specs to gate real-backend / env-dependent journeys (REAL_BACKEND_URL,
# CAPTURE_QA, REAL_E2E_*). Those tests DO run when the env is provisioned — they
# are runtime guards, not disabled tests. Scoped to e2e specs so a genuinely
# disabled unit test elsewhere is still flagged.
sonar.issue.ignore.multicriteria=cb1,cb2,cb3,cb4,cb5,sk1
sonar.issue.ignore.multicriteria.sk1.ruleKey=typescript:S1607
sonar.issue.ignore.multicriteria.sk1.resourceKey=**/e2e/**/*.spec.ts
