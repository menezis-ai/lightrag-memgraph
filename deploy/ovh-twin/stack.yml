# Docker Stack — Twin RAG real backend (Memgraph + LightRAG + WebUI).
#
# Single source of truth for the OVH 37.59.104.111 demo. Deploy with:
#
#   docker stack deploy -c stack.yml twin-real
#
# Traefik on the host (dokploy-network) terminates TLS for
# `maquette.sigilum.fr` and applies HTTP Basic Auth via a swarm
# middleware. Memgraph stays internal-only. Image tags:
#
#   twin-real-app:<rev>     — built locally from deploy/ovh-twin/Dockerfile.
#
# Env file (NOT committed; deploy with `--env-file twin-real.env`):
#
#   OPENAI_API_KEY=sk-...           # required; LightRAG calls it for
#                                   # chunking/extraction/query
#   TWIN_BASIC_AUTH=user:$$apr1$$.. # htpasswd line; $ doubled for YAML
#   IMAGE_TAG=2026-06-01a           # stamp to force a fresh roll-out
#
# DNS prerequisite: maquette.sigilum.fr → 37.59.104.111 (A record).

version: "3.8"

services:
  memgraph:
    image: memgraph/memgraph-mage:3.10.1
    command:
      - "--log-level=WARNING"
      - "--also-log-to-stderr"
      - "--memory-limit=2048"
      - "--storage-snapshot-on-exit=true"
      - "--storage-snapshot-interval-sec=3600"
    networks:
      - dokploy-network
    volumes:
      - twin-real-memgraph:/var/lib/memgraph
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        reservations:
          memory: 1G
        limits:
          memory: 3G

  app:
    image: twin-real-app:${IMAGE_TAG:-latest}
    networks:
      - dokploy-network
    environment:
      MEMGRAPH_URI: "bolt://memgraph:7687"
      # Single workspace env var since `_constants.resolve_workspace`
      # falls back through MEMGRAPH_WORKSPACE → WORKSPACE →
      # TWIN_DEFAULT_SPACE → "base". The dual-write era is over.
      WORKSPACE: "${WORKSPACE:-cib}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      LLM_BINDING_API_KEY: "${OPENAI_API_KEY}"
      EMBEDDING_BINDING_API_KEY: "${OPENAI_API_KEY}"
      # No LightRAG auth (the Traefik middleware owns it). The bundle
      # boots with debugUser baked into the SPA runtime config.
      AUTH_ACCOUNTS: ""
      TOKEN_SECRET: ""
    volumes:
      - twin-real-rag:/data
    depends_on:
      - memgraph
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      labels:
        # Traefik routing — HTTPS only, HTTP redirects to HTTPS.
        - "traefik.enable=true"
        - "traefik.http.routers.twin-real.rule=Host(`maquette.sigilum.fr`)"
        - "traefik.http.routers.twin-real.entrypoints=websecure"
        - "traefik.http.routers.twin-real.tls=true"
        - "traefik.http.routers.twin-real.tls.certresolver=letsencrypt"
        - "traefik.http.routers.twin-real.middlewares=twin-real-auth"
        - "traefik.http.services.twin-real.loadbalancer.server.port=9621"
        # Basic Auth — TWIN_BASIC_AUTH is "user:$$apr1$$..." (htpasswd
        # line). $ doubled so docker-compose/Stack doesn't try to
        # expand it as a variable.
        - "traefik.http.middlewares.twin-real-auth.basicauth.users=${TWIN_BASIC_AUTH}"
        # HTTP → HTTPS redirect.
        - "traefik.http.routers.twin-real-http.rule=Host(`maquette.sigilum.fr`)"
        - "traefik.http.routers.twin-real-http.entrypoints=web"
        - "traefik.http.routers.twin-real-http.middlewares=twin-real-https"
        - "traefik.http.middlewares.twin-real-https.redirectscheme.scheme=https"

networks:
  dokploy-network:
    external: true

volumes:
  twin-real-memgraph:
    driver: local
  twin-real-rag:
    driver: local
