  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lex; align-items:center; gap:7px; margin-bottom:12px;\"><span style=\"font-size:11.5px; color:var(--muted);\">Synonyms:<\u002Fspan><span style=\"font-family:var(--mono); font-size:10.5px; color:var(--muted); background:var(--panel); border:1px solid var(--border); border-radius:5px; padding:1px 7px;\">recovery-manager<\u002Fspan><\u002Fdiv>\n            <p style=\"font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin:0;\">Oracle Recovery Manager — the supported backup and recovery toolchain for Oracle Database. Use for any source dealing with rman backups, archive log management, restore procedures, or PITR.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--border-soft); padding:15px 16px;\">\n            <div style=\"font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--muted); margin-bottom:11px;\">USAGE<\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:9px;\">\n              <sc-for list=\"{{ tagUsage }}\" as=\"u\" hint-placeholder-count=\"3\">\n                <div style=\"background:var(--surface-warm); border:1px solid var(--border-soft); border-radius:9px; padding:11px 10px; text-align:center;\">\n                  <div style=\"font-family:var(--serif); font-weight:600; font-size:20px; color:var(--blue); line-height:1;\">{{ u.n }}<\u002Fdiv>\n                  <div style=\"font-family:var(--mono); font-size:9px; letter-spacing:.05em; color:var(--muted); margin-top:5px;\">{{ u.l }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--border-soft); padding:15px 16px;\">\n            <div style=\"font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--muted); margin-bottom:11px;\">LAST TAGGED DOCS<\u002Fdiv>\n            <a style=\"display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 11px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; cursor:pointer; text-decoration:none;\"><span style=\"display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11.5px; color:var(--ink);\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.6\"><path d=\"M14 3v5h5\"><\u002Fpath><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-5Z\"><\u002Fpath><\u002Fsvg>oracle-restart-procedure.pdf<\u002Fspan><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--blue)\" stroke-width=\"1.8\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n            <a style=\"display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 11px; border:1px solid var(--border); border-radius:8px; cursor:pointer; text-decoration:none;\"><span style=\"display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11.5px; color:var(--ink); min-width:0;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--blue-bright)\" stroke-width=\"1.6\"><path d=\"M9 15 15 9\"><\u002Fpath><path d=\"M11 6.5 13 4.5a4 4 0 0 1 6 6l-2 2\"><\u002Fpath><path d=\"M13 17.5 11 19.5a4 4 0 0 1-6-6l2-2\"><\u002Fpath><\u002Fsvg><span style=\"white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">/cib/runbooks/rman-restore-cookbook<\u002Fspan><\u002Fspan><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--blue)\" stroke-width=\"1.8\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== RETRIEVAL ===== -->\n    <sc-if value=\"{{ isRetrieval }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Retrieval\" style=\"display:grid; grid-template-columns:248px 1fr 316px; height:calc(100vh - 62px); min-height:660px; animation:twfade .25s ease;\">\n      <!-- conversations -->\n      <aside style=\"border-right:1px solid var(--border); background:var(--surface-warm); display:flex; flex-direction:column; padding:16px 14px;\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;\">\n          <span style=\"font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--muted);\">CONVERSATIONS<\u002Fspan>\n          <button style=\"display:flex; align-items:center; gap:5px; height:28px; padding:0 10px; border:1px solid var(--border-strong); background:var(--surface); border-radius:7px; cursor:pointer; font-weight:600; font-size:12px; color:var(--blue); box-shadow:var(--sh-sm);\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg> New<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:4px;\">\n          <sc-for list=\"{{ conversations }}\" as=\"cv\" hint-placeholder-count=\"4\">\n            <button style=\"text-align:left; border:1px solid {{ cv.bd }}; background:{{ cv.bg }}; border-radius:9px; padding:10px 11px; cursor:pointer;\">\n              <div style=\"font-size:13px; font-weight:600; color:{{ cv.tcol }}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ cv.title }}<\u002Fdiv>\n              <div style=\"font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:4px;\">{{ cv.meta }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Faside>\n\n      <!-- thread -->\n      <section style=\"display:flex; flex-direction:column; min-width:0; background:var(--canvas);\">\n        <div style=\"flex:1; overflow:auto; padding:28px 40px;\">\n          <div style=\"max-width:760px; margin:0 auto;\">\n            <!-- user -->\n            <div style=\"display:flex; justify-content:flex-end; margin-bottom:22px;\">\n              <div style=\"max-width:75%; background:linear-gradient(150deg,var(--blue),var(--blue-bright)); color:#fff; padding:12px 16px; border-radius:14px 14px 4px 14px; font-size:14px; line-height:1.5; box-shadow:0 3px 10px rgba(45,90,142,.25);\">How do I safely restart the Oracle DB on RHEL 9 in CIB prod?<\u002Fdiv>\n            <\u002Fdiv>\n            <!-- assistant -->\n            <div data-tour=\"answer\" style=\"display:flex; gap:13px; margin-bottom:8px;\">\n              <div style=\"width:32px; height:32px; border-radius:9px; background:linear-gradient(150deg,var(--blue),var(--blue-bright)); flex-shrink:0; display:flex; align-items:center; justify-content:center; box-shadow:var(--sh-sm);\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M4 6.5C4 5.7 4.7 5 5.5 5H11v14H5.5C4.7 19 4 18.3 4 17.5V6.5Z\" fill=\"#fff\" fill-opacity=\".95\"><\u002Fpath><path d=\"M20 6.5C20 5.7 19.3 5 18.5 5H13v14h5.5c.8 0 1.5-.7 1.5-1.5V6.5Z\" fill=\"#fff\" fill-opacity=\".6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <div style=\"flex:1; min-width:0;\">\n                <div style=\"background:var(--surface); border:1px solid var(--border); border-radius:4px 14px 14px 14px; padding:17px 19px; box-shadow:var(--sh-sm);\">\n                  <p style=\"margin:0 0 12px; font-size:14px; line-height:1.65; color:var(--ink);\">Follow the CIB-approved graceful sequence — never a hard <span style=\"font-family:var(--mono); font-size:12.5px; background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:0 5px;\">kill<\u002Fspan> on the instance:<\u002Fp>\n                  <ol style=\"margin:0 0 14px; padding-left:20px; font-size:14px; line-height:1.75; color:var(--ink-soft);\">\n                    <li>Notify the on-call DBA and raise a change ticket <span style=\"color:var(--blue-bright); font-weight:600; cursor:pointer;\">[1]<\u002Fspan>.<\u002Fli>\n                    <li>Drain the listener, then <span style=\"font-family:var(--mono); font-size:12.5px; background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:0 5px;\">shutdown immediate<\u002Fspan> — confirm no active RMAN job is running <span style=\"color:var(--blue-bright); font-weight:600; cursor:pointer;\">[1]<\u002Fspan>.<\u002Fli>\n                    <li>On RHEL 9, watch for PGA OOM on large-pages hosts; the 2026-04 cascade started here <span style=\"color:var(--blue-bright); font-weight:600; cursor:pointer;\">[2]<\u002Fspan>.<\u002Fli>\n                    <li>Restart, then validate AWR snapshots before re-opening to traffic <span style=\"color:var(--blue-bright); font-weight:600; cursor:pointer;\">[3]<\u002Fspan>.<\u002Fli>\n                  <\u002Fol>\n                  <div style=\"padding:11px 13px; background:var(--green-soft); border:1px solid var(--green-soft-bd); border-radius:9px; font-size:13px; color:var(--green); line-height:1.55;\"><strong>Tip —<\u002Fstrong> the runbook ships a pre-flight checklist script; run it first to confirm the listener drain completed cleanly.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:14px; margin:10px 2px 0; font-family:var(--mono); font-size:11px; color:var(--muted);\">\n                  <span style=\"display:flex; align-items:center; gap:5px;\"><span style=\"width:6px; height:6px; border-radius:50%; background:var(--green-bright);\"><\u002Fspan>hybrid<\u002Fspan>\n                  <span>top_k 60<\u002Fspan><span>5 sources cited<\u002Fspan><span>1.4s<\u002Fspan>\n                <\u002Fdiv>\n\n                <!-- sources -->\n                <div style=\"margin-top:16px;\">\n                  <div style=\"font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--muted); margin-bottom:9px;\">CITED SOURCES<\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; gap:8px;\">\n                    <sc-for list=\"{{ sources }}\" as=\"s\" hint-placeholder-count=\"3\">\n                      <div style=\"display:flex; align-items:center; gap:12px; padding:11px 13px; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--sh-sm);\">\n                        <span style=\"width:22px; height:22px; border-radius:6px; background:var(--blue-soft); color:var(--blue); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; font-weight:700; flex-shrink:0;\">{{ s.n }}<\u002Fspan>\n                        <span style=\"flex-shrink:0; display:flex;\">{{ s.icon }}<\u002Fspan>\n                        <span style=\"flex:1; min-width:0; font-family:var(--mono); font-size:12.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ s.name }}<\u002Fspan>\n                        <div style=\"display:flex; gap:4px;\">{{ s.tags }}<\u002Fdiv>\n                        <span style=\"font-family:var(--mono); font-size:11px; color:var(--muted);\">{{ s.chunk }}<\u002Fspan>\n                        <span style=\"font-family:var(--mono); font-size:11.5px; font-weight:600; color:var(--green); background:var(--green-soft); border:1px solid var(--green-soft-bd); border-radius:6px; padding:2px 7px;\">{{ s.score }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- input -->\n        <div style=\"border-top:1px solid var(--border); background:var(--surface); padding:14px 40px;\">\n          <div style=\"max-width:760px; margin:0 auto; display:flex; align-items:center; gap:10px;\">\n            <div style=\"flex:1; display:flex; align-items:center; gap:10px; height:46px; padding:0 16px; border:1px solid var(--border-strong); border-radius:12px; background:var(--surface-warm);\">\n              <span style=\"font-size:14px; color:var(--faint);\">Ask a follow-up about the knowledge base…<\u002Fspan>\n            <\u002Fdiv>\n            <button style=\"display:flex; align-items:center; gap:7px; height:46px; padding:0 20px; border:none; background:linear-gradient(150deg,var(--blue),var(--blue-bright)); border-radius:12px; cursor:pointer; font-weight:600; font-size:14px; color:#fff; box-shadow:0 3px 10px rgba(45,90,142,.3);\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\"><path d=\"M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z\"><\u002Fpath><\u002Fsvg> Send<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- params -->\n      <aside style=\"border-left:1px solid var(--border); background:var(--surface); display:flex; flex-direction:column; padding:20px 18px; overflow:auto;\">\n        <div style=\"font-family:var(--serif); font-weight:600; font-size:16px; color:var(--ink);\">Parameters<\u002Fdiv>\n        <div style=\"font-size:12.5px; color:var(--muted); margin:3px 0 18px;\">Configure your query<\u002Fdiv>\n\n        <label style=\"font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--muted); display:block; margin-bottom:7px;\">QUERY MODE<\u002Flabel>\n        <div style=\"display:flex; align-items:center; justify-content:space-between; height:38px; padding:0 12px; border:1px solid var(--border-strong); border-radius:8px; background:var(--surface-warm); margin-bottom:16px;\"><span style=\"font-size:13px; color:var(--ink);\">mix<\u002Fspan><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;\">\n          <div><label style=\"font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--muted); display:block; margin-bottom:7px;\">TOP K<\u002Flabel> center; gap:6px; height:38px; padding:0 15px; border:1px solid rgba(34,42,51,.14); background:#fff; border-radius:10px; cursor:pointer; font-family:'Hanken Grotesk',sans-serif; font-weight:600; font-size:13px; color:#46505A;\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg> Précédent\n          <\u002Fbutton>\n          <button onclick=\"{{ next }}\" style=\"display:flex; align-items:center; gap:7px; height:38px; padding:0 18px; border:none; background:linear-gradient(150deg,#2D5A8E,#3F8EBF); border-radius:10px; cursor:pointer; font-family:'Hanken Grotesk',sans-serif; font-weight:600; font-size:13px; color:#fff; box-shadow:0 4px 12px rgba(45,90,142,.32);\">\n            {{ nextLabel }} <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===== WELCOME ===== -->\n  <sc-if value=\"{{ showWelcome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:absolute; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; background:rgba(28,33,42,.34); backdrop-filter:blur(3px); animation:tgRise .5s ease;\">\n      <div style=\"width:min(560px,90%); background:#FBFAF5; border:1px solid #E6E1D6; border-radius:24px; box-shadow:0 40px 90px rgba(18,22,28,.4); padding:40px 40px 34px; text-align:center;\">\n        <div style=\"display:inline-flex; align-items:center; gap:10px; margin-bottom:22px;\">\n          <span style=\"width:38px; height:38px; border-radius:11px; background:linear-gradient(150deg,#2D5A8E,#3F8EBF); display:flex; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(45,90,142,.35);\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M4 6.5C l=\"{{ false }}\">\n    <div style=\"position:absolute; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; background:rgba(28,33,42,.40); backdrop-filter:blur(3px); animation:tgRise .5s ease;\">\n      <div style=\"width:min(580px,90%); background:#FBFAF5; border:1px solid #E6E1D6; border-radius:24px; box-shadow:0 40px 90px rgba(18,22,28,.42); padding:38px 40px 32px; text-align:center;\">\n        <span style=\"display:inline-flex; align-items:center; justify-content:center; width:54px; height:54px; border-radius:16px; background:#E9F2EB; border:1px solid #CBE3D1; margin-bottom:20px;\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3D7A4E\" stroke-width=\"2.2\"><path d=\"M5 12.5l4.5 4.5L19 7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <h1 style=\"font-family:'Spectral',Georgia,serif; font-weight:500; font-size:28px; line-height:1.2; color:#222A33; margin:0 0 12px; letter-spacing:-.01em;\">Vous avez fait le tour<\u002Fh1>\n        <p style=\"font-size:14px; line-height:1.65; color:#46505A; margin:0 auto 22px; max-width:420px; text-wrap:pretty;\">Twin KMS, c’est une base de connaissances calme et ordonnée — chaque réponse sourcée, chaque action tracée. Tout reste à portée de main.<\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:26px;\">\n          <sc-for list=\"{{ recapChips }}\" as=\"rc\" hint-placeholder-count=\"7\">\n            <span style=\"display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:#46505A; background:#fff; border:1px solid #E6E1D6; border-radius:16px; padding:6px 12px;\"><span style=\"width:7px; height:7px; border-radius:50%; background:{{ rc.c }};\"><\u002Fspan>{{ rc.t }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:center; justify-content:center;\">\n          <button onclick=\"{{ restart }}\" style=\"display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 22px; border:none; background:linear-gradient(150deg,#2D5A8E,#3F8EBF); border-radius:11px; cursor:pointer; font-family:'Hanken Grotesk',sans-serif; font-weight:600; font-size:14px; color:#fff; box-shadow:0 5px 14px rgba(45,90,142,.34);\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\"><path d=\"M4 9a8 8 0 0 1 13-3l3 3M20 4v5h-5\"><\u002Fpath><path d=\"M20 15a8 8 0 0 1-13 3l-3-3M4 20v-5h5\"><\u002Fpath><\u002Fsvg> Revoir la visite<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;autostart&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;startTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Documents&quot;,&quot;Tags&quot;,&quot;Retrieval&quot;,&quot;Graph&quot;,&quot;Activity&quot;,&quot;Settings&quot;],&quot;default&quot;:&quot;Documents&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    tab: this.props.defaultTab || 'Documents',\n    folderOpen: false,\n    notifOpen: false,\n    settingsSub: 'Profile',\n    sent: false,\n    docFilter: 'All',\n    entity: 'Oracle Database',\n    dark: this.props.defaultTheme === 'Dark',\n      started: !!this.props.autostart,\n    step: 1,\n  };\n\n  \n\n  componentDidMount(){\n    this.STEPS = [\n      null,\n      { tab:'Documents', target:null, accent:'#2D5A8E', kicker:'01 — ESPACE DE TRAVAIL', title:'Vos sources, au même endroit',\n        body:'Toutes les sources qui nourrissent vos réponses — fichiers, runbooks, liens — réunies, filtrables et suivies du dépôt jusqu’à l’indexation.', pad:0.94, maxScale:1.0 },\n      { tab:'Documents', target:'review', accent:'#C7891C', kicker:'02 — VALIDATION', title:'Rien n’entre sans relecture',\n        body:'Les d
